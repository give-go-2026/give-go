name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neon
          POSTGRES_PASSWORD: npg
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://neon:npg@localhost:5432/neondb
      NEON_LOCAL: 'true'
      AUTH_SECRET: e2e-test-secret-that-is-at-least-32-characters-long
      RESEND_API_KEY: re_test_fake_key_for_e2e_testing
      NEXT_PUBLIC_PRODUCT_NAME: 'Give&Go'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Push database schema
        run: cd apps/web && bun run db:push

      - name: Seed database
        run: cd apps/web && bun run src/database/seed.ts

      - name: Build application
        run: cd apps/web && bun run build

      - name: Run E2E tests
        run: cd apps/web && bunx playwright test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload test traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
