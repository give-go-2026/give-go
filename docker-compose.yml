services:
  db:
    image: neondatabase/neon_local:latest
    ports:
      - "5432:5432"
    env_file:
      - ./apps/web/.env

  web:
    image: oven/bun:1.3.4
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./apps/web/.env
    environment:
      WATCHPACK_POLLING: "true"
    command: sh -c "bun install && bun --filter web run dev"
    depends_on:
      - db

volumes:
  node_modules:
